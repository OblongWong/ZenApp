# ===========================================================================
# ZENAPP APPLICATION CONFIGURATION
# ===========================================================================
# Configuration for Spring Boot application
# Database: mindfulness_app (MySQL)
# ===========================================================================

# Application name
spring.application.name=zenapp

# ===========================================================================
# DATABASE CONFIGURATION
# ===========================================================================
# MySQL database connection settings
spring.datasource.url=jdbc:mysql://localhost:3306/mindfulness_app
spring.datasource.username=root
spring.datasource.password=Trinininja1!
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================================================================
# JPA/HIBERNATE SETTINGS
# ===========================================================================
# Auto-update database schema to match entity classes
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in console for debugging
spring.jpa.show-sql=true

# MySQL dialect for Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===========================================================================
# SECURITY SETTINGS
# ===========================================================================
# Default admin credentials
spring.security.user.name=admin
spring.security.user.password=admin123

# ===========================================================================
# SERVER CONFIGURATION
# ===========================================================================
# Server runs on port 8080
server.port=8080

# Session timeout (30 minutes)
server.servlet.session.timeout=30m

# ===========================================================================
# LOGGING
# ===========================================================================
# Application logging levels
logging.level.root=INFO
logging.level.com.zenapp.app=DEBUG
logging.level.org.springframework=INFO

# ===========================================================================
# JSON CONFIGURATION
# ===========================================================================
# JSON date format and timezone
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=America/Port_of_Spain
spring.jackson.deserialization.fail-on-unknown-properties=false

# ===========================================================================
# STATIC RESOURCES
# ===========================================================================
# Serve static files (HTML, CSS, JS)
spring.web.resources.add-mappings=true
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0

# ===========================================================================
# FILE UPLOAD
# ===========================================================================
# Maximum upload file size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===========================================================================
# ERROR HANDLING
# ===========================================================================
# Include error details in responses
server.error.include-stacktrace=always
server.error.include-message=always